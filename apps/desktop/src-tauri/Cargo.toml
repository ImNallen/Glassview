[package]
name = "glassview"
version = "0.1.0"
description = "Shows clicks and shortcuts on screen for recordings and demos"
authors = ["Glassview"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# macOS 27's dyld rejects proc-macro dylibs that rustc strips in release builds
# ("mis-aligned LINKEDIT string pool"). Build-time code never ships in the app.
[profile.release.build-override]
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSEvent", "NSResponder", "NSWindow", "block2", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFMachPort", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
